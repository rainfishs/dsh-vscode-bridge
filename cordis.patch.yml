# The dsh-vscode-bridge bundle layer.
#
# What it mounts: the login-URL file writer, the widened browser session cookie,
# and the two routes a clicked file takes to reach VS Code. Applied after
# @deepseek-ai/dsh-base and @deepseek-ai/dsh-web-app, because
# `dsh plugin add` appends a newly installed bundle to the end of the profile's
# `dsh.profile.bundles` list and layers apply in that order. Nothing here
# overrides an earlier row: the list holds inserts only.
#
# A patch row references the package by NAME rather than by a source path, which
# is what lets Node resolve the installed copy from the profile directory. The
# row injects `webServer` and `connection` and provides no service of its own, so
# it sits loose — an isolate realm would hide those two from it.
#
# The package also declares `dsh.client`, so the same row's browser half
# (`lib/client.js`) ships with it and the shell loads it at boot. A change to
# that file needs a dsh restart: the module graph is composed at activation.

- insert:
    - id: dsh-vscode-bridge
      name: 'dsh-vscode-bridge'
      config:
        # Destination for the login URL. Override it by id in the profile's own
        # `cordis.patch.yml` (or the home-level one) to name a standing path —
        # in single quotes, because YAML double quotes treat `\U` as an escape.
        # While this stays empty the row activates and writes nothing.
        #
        # There is deliberately no startup flag: the shipped Web app's own
        # commander program declares no `allowUnknownOption()`, so an option it
        # does not know fails the boot before any row reads it.
        path: null

        # Where a click on a file in the Web GUI goes:
        #   null / anything else — the right Sidebar's document preview (default)
        #   vscode               — hand the file to VS Code (`Code.exe -r -g`)
        # The browser half reads this per click, so a live patch reload of this
        # row takes effect on the next click, without a page refresh.
        openFileIn: null

        # The VS Code command to launch: an absolute path to `Code.exe` (or
        # `code` on macOS/Linux), or a bare command name found on PATH. Empty
        # means detect it — the installer's own locations first, then the
        # user-first Windows `App Paths` registry.
        vscodeExecutablePath: null

        # Reuse the last active VS Code window, which is the one the click came
        # from. `false` lets the CLI choose (it may open a new window).
        reuseWindow: null
